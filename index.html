<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MaratonArq 2026 - Inscrições abertas</title>
  <meta name="description" content="Três dias de imersão e um hackathon de 24 horas para estudantes de arquitetura. 11 a 13 de setembro, UDESC Laguna. Inscrições gratuitas." />
  <meta name="theme-color" content="#F5F0E3" />

  <!-- Sem isso, o card que aparece ao colar o link (WhatsApp, Discord,
       Slack, X…) cai no comportamento padrão de cada app em vez de usar
       o título e a descrição que a gente escolheu. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.maratonarq.com.br/" />
  <meta property="og:title" content="MaratonArq 2026 - Inscrições abertas" />
  <meta property="og:description" content="Três dias de imersão e um hackathon de 24 horas para estudantes de arquitetura. 11 a 13 de setembro, UDESC Laguna. Inscrições gratuitas." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="MaratonArq 2026 - Inscrições abertas" />
  <meta name="twitter:description" content="Três dias de imersão e um hackathon de 24 horas para estudantes de arquitetura. 11 a 13 de setembro, UDESC Laguna. Inscrições gratuitas." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- Faces da marca que aparecem acima da dobra -->
  <link rel="preload" href="/fonts/FieldsDisplay-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/FuturaPT-Book.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Cormorant Garamond / Jost seguem como reserva se um woff2 falhar;
       IBM Plex Mono é a fonte mono do site (horários da programação). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
